name: Windows checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Accounting, CSV, API and activity regression tests
        run: python -m unittest discover -s . -p 'test_*.py'
      - name: Chart scale checks
        run: node test_chart.cjs
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build portable EXE
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ProxyTrafficMonitor-Windows-x64
          path: release/ProxyTrafficMonitor.exe
